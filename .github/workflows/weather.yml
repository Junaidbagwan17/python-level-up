name: Rain Alert Bot

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "Python Intermediate/Day 35/requirements.txt"

      - name: Run weather bot
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python "Python Intermediate/Day 35/rain-forcast.py"
